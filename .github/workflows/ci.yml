name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest tests/unit tests/contract tests/integration tests/ml --cov=src/fulfilliq --cov-report=term-missing
      - run: python scripts/generate_synthetic_fixtures.py --output data/synthetic
      - run: python -m fulfilliq.cli prepare --source data/synthetic --output data/prepared/synthetic
      - run: python -m fulfilliq.cli replay --input data/prepared/synthetic --output data/batches/synthetic
      - run: python -m fulfilliq.cli local-ingest --input data/batches/synthetic --output data/local-curated/synthetic
      - run: python -m fulfilliq.cli local-query --input data/local-curated/synthetic --output data/exports/synthetic --mode synthetic
      - run: python -m fulfilliq.cli build-dashboard-data --input data/exports/synthetic --output web/public/data --mode synthetic
      - working-directory: web
        run: npm ci && npm run lint && npm run test && npm run build
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
