name: Deploy Lambda (manual only)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  deploy:
    if: ${{ vars.ALLOW_CLOUD_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_lambda.py
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: ${{ vars.FULFILLIQ_DEPLOY_ROLE_ARN }}, aws-region: ${{ vars.AWS_REGION }} }
      - run: aws lambda update-function-code --function-name "${{ vars.FULFILLIQ_LAMBDA_NAME }}" --zip-file fileb://artifacts/fulfilliq-lambda.zip
      - run: aws lambda wait function-updated --function-name "${{ vars.FULFILLIQ_LAMBDA_NAME }}"
